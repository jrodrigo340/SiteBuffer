<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador · Pato Confeiteiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header>
    <div class="barra">
      <a class="logo" href="index.html">Pato Confeiteiro</a>
      <nav aria-label="Principal">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="simulador.html" aria-current="page">Simulador</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="sobre.html">Sobre</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="duas-colunas">
      <div>
        <h1>Simulador de pedido</h1>
        <p>Escolha o item e a quantidade. A partir de 5 unidades há 10% de desconto, e a partir de 10, 15%.</p>

        <form id="form-simulador" class="caixa" novalidate>
          <label for="item">Item</label>
          <select id="item"></select>

          <label for="quantidade">Quantidade</label>
          <input id="quantidade" type="number" min="1" value="1">

          <p><button class="botao" type="submit">Calcular total</button></p>

          <div id="saida" class="resultado" aria-live="polite">O total aparece aqui.</div>
        </form>
      </div>
      <img class="img-pato" src="img/simulador.jpg" alt="Pato confeiteiro fazendo contas numa mesa cheia de papéis e gráficos">
    </section>
  </main>

  <footer>Pato Confeiteiro · projeto de HTML, CSS e JavaScript</footer>

  <script src="js/dados.js"></script>
  <script src="js/simulador.js"></script>
</body>
</html>
