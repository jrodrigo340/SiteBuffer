<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro · Pato Confeiteiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header>
    <div class="barra">
      <a class="logo" href="index.html">Pato Confeiteiro</a>
      <nav aria-label="Principal">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="simulador.html">Simulador</a>
        <a href="cadastro.html" aria-current="page">Cadastro</a>
        <a href="sobre.html">Sobre</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="duas-colunas">
      <div>
        <h1>Cadastro</h1>

        <form id="form-cadastro" class="caixa" novalidate>
          <label for="nome">Nome completo</label>
          <input id="nome" type="text" autocomplete="name">
          <span class="erro" id="erro-nome"></span>

          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="email">
          <span class="erro" id="erro-email"></span>

          <label for="telefone">Telefone com DDD</label>
          <input id="telefone" type="tel" autocomplete="tel" placeholder="81 91234-5678">
          <span class="erro" id="erro-telefone"></span>

          <label for="senha">Senha (mínimo 6 caracteres)</label>
          <input id="senha" type="password" autocomplete="new-password">
          <span class="erro" id="erro-senha"></span>

          <label for="confirmar">Confirmar senha</label>
          <input id="confirmar" type="password" autocomplete="new-password">
          <span class="erro" id="erro-confirmar"></span>

          <label><input id="termos" type="checkbox">Aceito os termos de uso</label>
          <span class="erro" id="erro-termos"></span>

          <p><button class="botao" type="submit">Cadastrar</button></p>
          <p id="mensagem" class="sucesso" aria-live="polite"></p>
        </form>
      </div>
      <img class="img-pato" src="img/cadastro.jpg" alt="Pato confeiteiro segurando uma ficha de cadastro">
    </section>
  </main>

  <footer>Pato Confeiteiro · projeto de HTML, CSS e JavaScript</footer>

  <script src="js/cadastro.js"></script>
</body>
</html>
